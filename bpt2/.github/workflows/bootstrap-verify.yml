name: BPT2 bootstrap verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static architecture checks
        run: |
          python3 scripts/check-bootstrap-command.py
          python3 scripts/check-boundaries.py
          scripts/test-boundary-guard.sh
          python3 scripts/test-wire-host.py

  build-and-migrate:
    needs: architecture
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: BomPraTi
      PGUSER: postgres
      PGPASSWORD: postgres

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Generate pinned ABP host, migrations and build
        run: scripts/bootstrap-all.sh
      - name: Apply all host and module migrations
        run: scripts/migrate.sh
      - name: Re-apply migrations (idempotency smoke)
        run: scripts/migrate.sh
      - name: Ensure PostgreSQL client exists
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Verify expected schema
        run: scripts/schema-smoke.sh
      - name: Persistence, privacy and concurrency smoke
        run: scripts/persistence-smoke.sh
      - name: Backup and restore smoke
        run: scripts/backup-restore-smoke.sh
