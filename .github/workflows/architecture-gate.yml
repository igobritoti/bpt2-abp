name: BPT2 Architecture Gate

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'scripts/check-boundaries.py'
      - 'scripts/test-boundary-guard.sh'
      - '.github/workflows/architecture-gate.yml'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Positive boundary check
        run: python3 scripts/check-boundaries.py
      - name: Negative boundary attacks
        run: bash scripts/test-boundary-guard.sh
