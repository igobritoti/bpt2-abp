name: BPT2 Architecture Gate

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'scripts/check-boundaries.py'
      - 'scripts/test-boundary-guard.sh'
      - '.github/workflows/architecture-gate.yml'

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Positive boundary check
        run: python3 scripts/check-boundaries.py
      - name: Negative boundary attacks
        run: bash scripts/test-boundary-guard.sh
