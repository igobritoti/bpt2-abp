name: BPT2 Discovery Typo Scoring Benchmark

on:
  pull_request:
    paths:
      - 'benchmarks/discovery_br_v1.json'
      - 'tests/BomPraTi.AdvancedDiscoveryBenchmarkFixture/**'
      - 'tests/BomPraTi.TypoScoringBenchmarkFixture/**'
      - 'modules/catalog/**'
      - 'modules/marketplace/**'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/discovery-typo-scoring-benchmark.yml'
      - 'docs/generated/repository-facts.md'
      - 'docs/audits/2026-08-30-discovery-typo-scoring-comparison.md'
      - 'docs/agent/CURRENT-WORK.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typo-scoring-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      BPT_BENCHMARK_POSTGRES_IMAGE: postgres:17-alpine
      BPT_DISCOVERY_BENCHMARK_OUTPUT: artifacts/discovery-baseline-before-typo-scoring.json
      BPT_TYPO_SCORING_OUTPUT: artifacts/discovery-typo-scoring.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build frozen discovery fixture
        run: dotnet build tests/BomPraTi.AdvancedDiscoveryBenchmarkFixture/BomPraTi.AdvancedDiscoveryBenchmarkFixture.csproj --configuration Release
      - name: Build typo scoring fixture
        run: dotnet build tests/BomPraTi.TypoScoringBenchmarkFixture/BomPraTi.TypoScoringBenchmarkFixture.csproj --configuration Release
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed and execute frozen discovery baseline
        run: dotnet run --project tests/BomPraTi.AdvancedDiscoveryBenchmarkFixture/BomPraTi.AdvancedDiscoveryBenchmarkFixture.csproj --configuration Release --no-build
      - name: Execute typo scoring comparison
        run: dotnet run --project tests/BomPraTi.TypoScoringBenchmarkFixture/BomPraTi.TypoScoringBenchmarkFixture.csproj --configuration Release --no-build
      - name: Upload typo scoring evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discovery-typo-scoring-benchmark
          path: |
            artifacts/discovery-baseline-before-typo-scoring.json
            artifacts/discovery-typo-scoring.json
          if-no-files-found: error
