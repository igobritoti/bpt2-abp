name: BPT2 PR Lead Time Size Adjusted

on:
  pull_request:
    paths:
      - 'scripts/measure-pr-lead-time-size-adjusted.py'
      - 'docs/exec-plans/**/0068-pr-lead-time-size-adjusted.md'
      - '.github/workflows/pr-lead-time-size-adjusted.yml'
      - 'docs/generated/repository-facts.md'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-lead-time-size-adjusted:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Measure size-adjusted PR lead time
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          python3 scripts/measure-pr-lead-time-size-adjusted.py
      - name: Upload evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr-lead-time-size-adjusted
          path: artifacts/pr-lead-time-size-adjusted.json
          if-no-files-found: error
