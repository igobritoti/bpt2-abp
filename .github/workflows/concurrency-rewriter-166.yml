name: BPT2 Concurrency Inventory 166

on:
  push:
    branches:
      - "ci/scoped-concurrency-166"
    paths:
      - ".github/workflows/concurrency-rewriter-166.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "ci/scoped-concurrency-166"

      - name: Print fail-closed workflow inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re

          root = Path('.github/workflows')
          self_name = 'concurrency-rewriter-166.yml'
          files = sorted(
              p for p in root.iterdir()
              if p.is_file() and p.suffix in {'.yml', '.yaml'} and p.name != self_name
          )
          if len(files) != 26:
              raise SystemExit(f'expected 26 retained workflows, found {len(files)}')

          def trigger_inventory(lines):
              for i, line in enumerate(lines):
                  if line.startswith('on:'):
                      inline = line[3:].strip()
                      if inline:
                          return inline
                      events = []
                      j = i + 1
                      while j < len(lines):
                          candidate = lines[j]
                          if candidate and not candidate[0].isspace():
                              break
                          match = re.match(r'^  ([A-Za-z0-9_-]+):', candidate)
                          if match:
                              events.append(match.group(1))
                          j += 1
                      return ','.join(events) if events else '(none)'
              return '(missing)'

          protected = []
          preexisting = []
          missing_jobs = []
          rows = []
          for path in files:
              lines = path.read_text(encoding='utf-8').splitlines()
              existing = any(line.startswith('concurrency:') for line in lines)
              environment = any(re.match(r'^\s+environment:', line) for line in lines)
              deployment = any(re.match(r'^\s+deployment:', line) for line in lines)
              jobs = any(line == 'jobs:' for line in lines)
              rows.append((path.name, trigger_inventory(lines), existing, environment, deployment))
              if existing:
                  preexisting.append(path.name)
              if environment or deployment:
                  protected.append(path.name)
              if not jobs:
                  missing_jobs.append(path.name)

          if preexisting:
              raise SystemExit('pre-existing concurrency: ' + ','.join(preexisting))
          if protected:
              raise SystemExit('deployment/environment semantics: ' + ','.join(protected))
          if missing_jobs:
              raise SystemExit('missing jobs: ' + ','.join(missing_jobs))

          for row in rows:
              print('INVENTORY|' + '|'.join([
                  row[0], row[1],
                  f'concurrency={str(row[2]).lower()}',
                  f'environment={str(row[3]).lower()}',
                  f'deployment={str(row[4]).lower()}',
              ]))
          print(f'WORKFLOW_COUNT={len(files)}')
          print('PREEXISTING_CONCURRENCY=0')
          print('DEPLOYMENT_ENVIRONMENT_WORKFLOWS=0')
          print('INVENTORY_READY=YES')
          PY
