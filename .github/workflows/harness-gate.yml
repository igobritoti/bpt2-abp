name: BPT2 Harness Gate

on:
  pull_request:
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'docs/**'
      - 'scripts/check-harness.py'
      - 'scripts/check-action-pinning.py'
      - 'scripts/test-http-smoke-wiring.py'
      - 'scripts/test-ephemeral-migration-authority.py'
      - 'scripts/generate-repo-facts.py'
      - 'scripts/podium7-contract-projection-experiment.py'
      - 'scripts/fixtures/podium7-catalog-contract-v2-projection.json'
      - '.github/workflows/harness-gate.yml'
  push:
    branches:
      - main
    paths:
      - 'AGENTS.md'
      - 'README.md'
      - 'ARCHITECTURE.md'
      - 'docs/**'
      - 'scripts/check-harness.py'
      - 'scripts/check-action-pinning.py'
      - 'scripts/test-http-smoke-wiring.py'
      - 'scripts/test-ephemeral-migration-authority.py'
      - 'scripts/generate-repo-facts.py'
      - 'scripts/podium7-contract-projection-experiment.py'
      - 'scripts/fixtures/podium7-catalog-contract-v2-projection.json'
      - '.github/workflows/harness-gate.yml'

permissions:
  contents: read

jobs:
  harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Syntax check harness tooling
        run: python3 -m py_compile scripts/check-harness.py scripts/check-action-pinning.py scripts/test-http-smoke-wiring.py scripts/test-ephemeral-migration-authority.py scripts/generate-repo-facts.py scripts/podium7-contract-projection-experiment.py
      - name: Prove immutable external action references
        run: python3 scripts/check-action-pinning.py
      - name: Prove HTTP smoke wiring guard
        run: python3 scripts/test-http-smoke-wiring.py
      - name: Prove ephemeral migration authority guard
        run: python3 scripts/test-ephemeral-migration-authority.py
      - name: Validate knowledge base and generated facts
        run: python3 scripts/check-harness.py
      - name: Validate Podium 7 catalog projection boundary
        run: python3 scripts/podium7-contract-projection-experiment.py scripts/fixtures/podium7-catalog-contract-v2-projection.json
