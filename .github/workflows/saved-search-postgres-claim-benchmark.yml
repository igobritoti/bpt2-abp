name: BPT2 Saved Search PostgreSQL Claim Benchmark

on:
  pull_request:
    paths:
      - 'modules/marketplace/src/BomPraTi.Marketplace/Domain/SavedSearch.cs'
      - 'modules/marketplace/src/BomPraTi.Marketplace/Domain/SavedSearchAlertDetectionRequest.cs'
      - 'modules/marketplace/src/BomPraTi.Marketplace/Services/SavedSearchAlertDetectionProcessor.cs'
      - 'tests/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture/**'
      - 'docs/audits/2026-08-29-saved-search-postgres-claim-baseline.md'
      - 'docs/agent/CURRENT-WORK.md'
      - 'docs/generated/repository-facts.md'
      - '.github/workflows/saved-search-postgres-claim-benchmark.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  saved-search-postgres-claim:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      BPT_SAVED_SEARCH_CLAIM_OUTPUT: artifacts/saved-search-postgres-claim-baseline.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build claim benchmark
        run: dotnet build tests/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture.csproj --configuration Release
      - name: Build production explicit-claim probe
        run: dotnet build tests/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture/ProductionExplicitClaim/BomPraTi.SavedSearchExplicitClaimFixture.csproj --configuration Release
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Execute claim/recovery baseline
        run: dotnet run --project tests/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture.csproj --configuration Release --no-build
      - name: Exercise production explicit claim
        run: dotnet run --project tests/BomPraTi.SavedSearchPostgresClaimBenchmarkFixture/ProductionExplicitClaim/BomPraTi.SavedSearchExplicitClaimFixture.csproj --configuration Release --no-build
      - name: Upload claim evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: saved-search-postgres-claim-baseline
          path: artifacts/saved-search-postgres-claim-baseline.json
          if-no-files-found: error
