name: BPT2 Legacy Bootstrap Compatibility

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bpt2/**'
      - '.github/workflows/bpt2-vertical-slice.yml'

permissions:
  contents: read

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate canonical root host
        run: bash scripts/bootstrap-host.sh

      - name: Build canonical root solution
        run: dotnet build main/BomPraTi.slnx --configuration Release --nologo

      - name: Apply canonical fresh migrations
        run: bash scripts/fresh-migration-gate.sh
