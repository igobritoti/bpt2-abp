name: BPT2 Gate 01 Host Build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'bpt2/main/**'
      - 'bpt2/global.json'
      - '.github/workflows/bpt2-vertical-slice.yml'

jobs:
  host-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build ABP host
        run: dotnet build bpt2/main/BomPraTi.slnx --configuration Release --nologo
