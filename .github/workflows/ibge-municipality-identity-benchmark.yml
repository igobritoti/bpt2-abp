name: BPT2 IBGE Municipality Identity Benchmark

on:
  pull_request:
    paths:
      - 'scripts/observe-ibge-dtb-2025.py'
      - 'scripts/benchmark-ibge-municipality-identity.py'
      - '.github/workflows/ibge-municipality-identity-benchmark.yml'
      - 'benchmarks/ibge-municipality-identity/**'
      - 'docs/audits/**municipality**'
      - 'docs/agent/CURRENT-WORK.md'
      - 'docs/generated/repository-facts.md'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ibge-municipality-identity:
    runs-on: ubuntu-24.04
    env:
      BPT_IBGE_MUNICIPALITY_OUTPUT: artifacts/ibge-municipality-identity-baseline.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Execute source-bound municipality identity baseline
        run: python scripts/benchmark-ibge-municipality-identity.py
      - name: Upload municipality identity evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ibge-municipality-identity-baseline
          path: artifacts/ibge-municipality-identity-baseline.json
          if-no-files-found: error
