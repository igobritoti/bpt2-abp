name: BPT2 Public Web Gate

on:
  pull_request:
    paths:
      - "public-web/**"
      - ".github/workflows/public-web-gate.yml"
  push:
    branches:
      - main
    paths:
      - "public-web/**"
      - ".github/workflows/public-web-gate.yml"

jobs:
  public-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-web

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Lint, typecheck and build
        run: npm run check
