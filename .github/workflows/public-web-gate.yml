name: BPT2 Public Web Gate

on:
  pull_request:
    paths:
      - "public-web/**"
      - ".github/workflows/public-web-gate.yml"
  push:
    branches:
      - main
    paths:
      - "public-web/**"
      - ".github/workflows/public-web-gate.yml"

jobs:
  public-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: public-web

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      # Initial package-lock.json generated with Node 22.13.0 / npm 10.9.2.
      - name: Prove npm ci rejects manifest-lock mismatch
        shell: bash
        run: |
          set -euo pipefail
          probe_dir="$(mktemp -d)"
          trap 'rm -rf "$probe_dir"' EXIT
          cp package.json package-lock.json "$probe_dir/"
          PROBE_DIR="$probe_dir" node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const manifestPath = path.join(process.env.PROBE_DIR, "package.json");
          const manifest = JSON.parse(fs.readFileSync(manifestPath, "utf8"));
          manifest.dependencies.react = "0.0.0-lockfile-probe";
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + "\n");
          NODE
          if (cd "$probe_dir" && npm ci --ignore-scripts --no-audit --no-fund > npm-ci-mismatch.log 2>&1); then
            cat "$probe_dir/npm-ci-mismatch.log"
            echo "npm ci unexpectedly accepted an inconsistent package.json/package-lock.json pair" >&2
            exit 1
          fi
          grep -Eiq 'package.json|lock ?file|lockfile|in sync' "$probe_dir/npm-ci-mismatch.log" || {
            cat "$probe_dir/npm-ci-mismatch.log"
            echo "npm ci failed, but not with lockfile-mismatch evidence" >&2
            exit 1
          }

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          git diff --exit-code -- package.json package-lock.json

      - name: Lint, typecheck and build
        run: npm run check
