name: Materialize generated ABP host

on:
  push:
    branches:
      - 'feat/product-implementation'
    paths:
      - '.github/workflows/materialize-dev-worktree.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/product-implementation
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate and wire ABP 10.6 host
        run: bash scripts/bootstrap-host.sh
      - name: Sanitize local-only material
        shell: bash
        run: |
          set -euo pipefail
          find main -type f \( -name '*.pfx' -o -name '*.p12' -o -name '*.key' -o -name '*.pem' \) -delete
          rm -f main/BomPraTi/appsettings.secrets.json
          printf '\n# Local secrets\nBomPraTi/appsettings.secrets.json\n' >> main/.gitignore
          find . -type d \( -name bin -o -name obj \) -prune -exec rm -rf {} + || true
      - name: Commit generated host
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'bpt2-ci'
          git config user.email 'actions@users.noreply.github.com'
          git add -- main
          if git diff --cached --quiet; then
            echo 'Generated host already materialized.'
            exit 0
          fi
          git commit -m 'build: materialize ABP 10.6 host'
          git push origin HEAD:feat/product-implementation
