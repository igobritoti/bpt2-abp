name: BPT2 Seller Auth HTTP Gate

on:
  pull_request:
    paths:
      - 'public-web/**'
      - 'main/BomPraTi/**'
      - 'scripts/seller-auth-http-smoke.sh'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/seller-auth-http-gate.yml'

permissions:
  contents: read

jobs:
  seller-auth-http:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database
      - name: Exercise Seller OIDC boundary
        run: bash scripts/seller-auth-http-smoke.sh
