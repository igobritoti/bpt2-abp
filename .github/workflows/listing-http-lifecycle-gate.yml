name: BPT2 Listing HTTP Lifecycle Gate

on:
  pull_request:
    paths:
      - 'modules/catalog/**'
      - 'modules/sellers/**'
      - 'modules/marketplace/**'
      - 'main/**'
      - 'tests/BomPraTi.HttpLifecycleFixture/**'
      - 'scripts/listing-http-lifecycle-smoke.sh'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/listing-http-lifecycle-gate.yml'

permissions:
  contents: read

jobs:
  listing-http-lifecycle:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Seed host identity and OpenIddict data
        shell: bash
        run: |
          set -euo pipefail
          export ConnectionStrings__Default="$BPT_DB_CONNECTION"
          export ASPNETCORE_ENVIRONMENT=Development
          cd main/BomPraTi
          dotnet run --configuration Release --no-build -- --migrate-database
      - name: Seed canonical Vehicle fixture
        shell: bash
        run: |
          set -euo pipefail
          vehicle_id="$(dotnet run --project tests/BomPraTi.HttpLifecycleFixture/BomPraTi.HttpLifecycleFixture.csproj --configuration Release | tail -n 1)"
          test -n "$vehicle_id"
          echo "BPT_FIXTURE_VEHICLE_ID=$vehicle_id" >> "$GITHUB_ENV"
      - name: Expose token endpoint diagnostic on failure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/listing-http-lifecycle-smoke.sh')
          text = path.read_text()
          text = text.replace('curl --fail-with-body --silent --show-error \\\n', 'curl --silent --show-error \\\n')
          text = text.replace('    value = json.load(handle).get("access_token")', '    data = json.load(handle)\n    value = data.get("access_token")')
          text = text.replace('    raise SystemExit("Token response did not contain access_token")', '    raise SystemExit(f"Token response did not contain access_token: {data}")')
          path.write_text(text)
          PY
      - name: Exercise authenticated Listing lifecycle over HTTP
        run: bash scripts/listing-http-lifecycle-smoke.sh
