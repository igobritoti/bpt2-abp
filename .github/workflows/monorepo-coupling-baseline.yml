name: BPT2 Monorepo Coupling Baseline

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'main/**'
      - 'modules/**'
      - 'tests/**'
      - 'public-web/**'
      - 'scripts/measure-monorepo-coupling.py'
      - 'docs/exec-plans/active/0062-monorepo-coupling-baseline.md'
      - '.github/workflows/**'
      - 'docs/generated/repository-facts.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monorepo-coupling-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Measure current repository coupling baseline
        run: python3 scripts/measure-monorepo-coupling.py
      - name: Upload reproducible baseline evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: monorepo-coupling-baseline
          path: artifacts/monorepo-coupling-baseline.json
          if-no-files-found: error
