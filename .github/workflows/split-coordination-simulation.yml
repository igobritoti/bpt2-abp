name: BPT2 Split Coordination Simulation

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'scripts/simulate-split-coordination.py'
      - 'docs/exec-plans/active/0063-split-coordination-simulation.md'
      - '.github/workflows/split-coordination-simulation.yml'
      - 'docs/generated/repository-facts.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  split-coordination-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BPT_SPLIT_HISTORY_REF: 53be795b6205ef57c03f1118e0c0287dc0f2873c
      BPT_SPLIT_WORKFLOW_REF: e0cb70b9307d0122541d1cf8a04686d9d044bad4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Simulate split coordination over all cross-boundary changes
        run: python3 scripts/simulate-split-coordination.py
      - name: Upload split simulation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: split-coordination-simulation
          path: artifacts/split-coordination-simulation.json
          if-no-files-found: error
