name: BPT2 Public Web Lock Generator

on:
  push:
    branches:
      - "chore/public-web-lock-165"
    paths:
      - ".github/workflows/public-web-lock-generator.yml"

permissions:
  contents: write

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "chore/public-web-lock-165"

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.13.0"

      - name: Generate and commit lockfile with CI toolchain
        shell: bash
        run: |
          set -euo pipefail
          echo "NODE_VERSION=$(node --version)"
          echo "NPM_VERSION=$(npm --version)"
          cd public-web
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package.json
          test "$(sha256sum package-lock.json | awk '{print $1}')" = "0be18e42a03ceb287249e4e22b0845d40ba6dfeacd793bf23de7b7c28381686b"
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public-web/package-lock.json
          git commit -m "chore: add public web package lock"
          git push origin HEAD:chore/public-web-lock-165
