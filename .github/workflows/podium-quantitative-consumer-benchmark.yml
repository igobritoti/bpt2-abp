name: BPT2 Podium Quantitative Consumer Benchmark

on:
  pull_request:
    paths:
      - 'benchmarks/podium_quantitative_consumer_v1.json'
      - 'tests/BomPraTi.PodiumQuantitativeConsumerBenchmarkFixture/**'
      - 'docs/audits/2026-08-29-podium-quantitative-consumer-benchmark.md'
      - 'docs/agent/CURRENT-WORK.md'
      - 'docs/generated/repository-facts.md'
      - '.github/workflows/podium-quantitative-consumer-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quantitative-consumer-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      BPT_QUANTITATIVE_BENCHMARK_OUTPUT: artifacts/podium-quantitative-consumer-benchmark.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build quantitative consumer benchmark
        run: dotnet build tests/BomPraTi.PodiumQuantitativeConsumerBenchmarkFixture/BomPraTi.PodiumQuantitativeConsumerBenchmarkFixture.csproj --configuration Release
      - name: Execute quantitative consumer benchmark
        run: dotnet run --project tests/BomPraTi.PodiumQuantitativeConsumerBenchmarkFixture/BomPraTi.PodiumQuantitativeConsumerBenchmarkFixture.csproj --configuration Release --no-build
      - name: Upload quantitative consumer evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: podium-quantitative-consumer-benchmark
          path: artifacts/podium-quantitative-consumer-benchmark.json
          if-no-files-found: error
