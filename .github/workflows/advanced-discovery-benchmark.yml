name: BPT2 Advanced Discovery Benchmark

on:
  pull_request:
    paths:
      - 'benchmarks/discovery_br_v1.json'
      - 'tests/BomPraTi.AdvancedDiscoveryBenchmarkFixture/**'
      - 'modules/catalog/**'
      - 'modules/marketplace/**'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/advanced-discovery-benchmark.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discovery-benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      BPT_BENCHMARK_POSTGRES_IMAGE: postgres:17-alpine
      BPT_DISCOVERY_BENCHMARK_OUTPUT: artifacts/discovery-baseline.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build benchmark fixture
        run: dotnet build tests/BomPraTi.AdvancedDiscoveryBenchmarkFixture/BomPraTi.AdvancedDiscoveryBenchmarkFixture.csproj --configuration Release
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Execute discovery baseline
        run: dotnet run --project tests/BomPraTi.AdvancedDiscoveryBenchmarkFixture/BomPraTi.AdvancedDiscoveryBenchmarkFixture.csproj --configuration Release --no-build
      - name: Upload baseline evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: advanced-discovery-baseline
          path: artifacts/discovery-baseline.json
          if-no-files-found: error
