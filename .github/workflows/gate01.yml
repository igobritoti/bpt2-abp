name: BPT2 Gate 01

on:
  pull_request:
    paths:
      - 'modules/**'
      - 'tests/BomPraTi.Gate01Smoke/**'
      - 'scripts/bootstrap-host.sh'
      - 'scripts/wire-host.py'
      - 'scripts/fresh-migration-gate.sh'
      - '.github/workflows/gate01.yml'

permissions:
  contents: read

jobs:
  gate01:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: BomPraTi
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d BomPraTi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      BPT_DB_CONNECTION: Host=localhost;Port=5432;Database=BomPraTi;Username=postgres;Password=postgres
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: BomPraTi
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Generate and wire ABP host
        run: bash scripts/bootstrap-host.sh
      - name: Apply fresh database
        run: bash scripts/fresh-migration-gate.sh
      - name: Run Gate 01 behavior smoke
        run: dotnet run --project tests/BomPraTi.Gate01Smoke/BomPraTi.Gate01Smoke.csproj --configuration Release
