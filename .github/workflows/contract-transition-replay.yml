name: BPT2 Contract Transition Replay

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    paths:
      - 'scripts/replay-contract-transitions.py'
      - 'docs/exec-plans/active/0065-contract-transition-replay.md'
      - 'docs/exec-plans/completed/0065-contract-transition-replay.md'
      - 'docs/audits/2026-09-03-contract-transition-replay.md'
      - '.github/workflows/contract-transition-replay.yml'
      - 'docs/generated/repository-facts.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Replay historical contract transitions
        run: |
          mkdir -p artifacts
          python3 scripts/replay-contract-transitions.py --output artifacts/contract-transition-replay.json

      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: contract-transition-replay
          path: artifacts/contract-transition-replay.json
          if-no-files-found: error
